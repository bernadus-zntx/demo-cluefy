name: cluefy-sales
services:
  sales:
    image: cluefy-sales:review
    build:
      context: .
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${CLUEFY_SALES_PORT:-3117}:3000"
    environment:
      SALES_SUPABASE_URL: ${SALES_SUPABASE_URL:-}
      SALES_SUPABASE_KEY: ${SALES_SUPABASE_KEY:-}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.50
    pids_limit: 64
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
