name: Sales read-only checks
on:
  pull_request:
    paths:
      - 'sales/**'
      - '.github/workflows/sales-check.yml'
      - 'app/page.tsx'
      - 'app/globals.css'
      - 'public/cluefy-icon-exact.png'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix sales --ignore-scripts
      - run: node sales/sync-existing-login.mjs --check
      - run: node --test sales/tests/*.test.mjs
      - run: docker compose -f sales/compose.yaml config --quiet
      - run: docker build -t cluefy-sales:check sales
      - name: Smoke Sales container without production credentials
        run: |
          docker run -d --name cluefy-sales-check --read-only --cap-drop ALL --security-opt no-new-privileges:true -p 127.0.0.1:3117:3000 cluefy-sales:check
          trap 'docker rm -f cluefy-sales-check' EXIT
          for attempt in $(seq 1 15); do
            if curl --fail --silent http://127.0.0.1:3117/healthz > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3117/healthz > /dev/null
          curl --fail --silent http://127.0.0.1:3117/sales > /dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3117/api/items)" = 503
