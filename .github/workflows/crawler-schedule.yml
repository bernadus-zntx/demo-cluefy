name: Scheduled Crawler

on:
  schedule:
    # GitHub cron uses UTC. The three-minute offset avoids the busiest top-of-hour window.
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

concurrency:
  group: cluefy-production-crawler
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  crawl:
    name: Crawl configured sources
    runs-on: ubuntu-latest
    timeout-minutes: 9
    environment: production
    env:
      CLUEFY_API_BASE_URL: https://cluefy-dashboard.vercel.app
      CRAWLER_API_KEY: ${{ secrets.CRAWLER_API_KEY }}
      CRAWLER_DEBUG: "1"
    steps:
      - name: Check crawler secret
        run: |
          if [ -z "$CRAWLER_API_KEY" ]; then
            echo "::error::GitHub secret CRAWLER_API_KEY belum tersedia."
            exit 1
          fi

      - name: Checkout source
        uses: actions/checkout@v5

      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Run one crawler cycle
        run: node scripts/crawler-worker.mjs --once

