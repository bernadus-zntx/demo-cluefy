name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cluefy-production
  cancel-in-progress: true

permissions:
  contents: read

env:
  VERCEL_ORG_ID: team_F5xjdqwA19QBSTqp5IA2TSG3
  VERCEL_PROJECT_ID: prj_4JSNaXKai1xgigGn28HbIrgGiESk

jobs:
  deploy:
    name: Build and deploy to Vercel
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CRAWLER_API_KEY: ${{ secrets.CRAWLER_API_KEY }}
    steps:
      - name: Check required secrets
        run: |
          missing=0
          for name in VERCEL_TOKEN NEXT_PUBLIC_SUPABASE_URL SUPABASE_SECRET_KEY CRAWLER_API_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::GitHub secret $name belum tersedia."
              missing=1
            fi
          done
          exit "$missing"

      - name: Checkout source
        uses: actions/checkout@v5

      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify production build
        run: npm run build

      - name: Deploy production
        id: deploy
        run: |
          deployment_url=$(npx --yes vercel@latest deploy \
            --prod \
            --yes \
            --archive=tgz \
            --token="$VERCEL_TOKEN" \
            --build-env "NEXT_PUBLIC_SUPABASE_URL=$NEXT_PUBLIC_SUPABASE_URL" \
            --build-env "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" \
            --build-env "SUPABASE_SECRET_KEY=$SUPABASE_SECRET_KEY" \
            --build-env "CRAWLER_API_KEY=$CRAWLER_API_KEY" \
            --env "NEXT_PUBLIC_SUPABASE_URL=$NEXT_PUBLIC_SUPABASE_URL" \
            --env "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" \
            --env "SUPABASE_SECRET_KEY=$SUPABASE_SECRET_KEY" \
            --env "CRAWLER_API_KEY=$CRAWLER_API_KEY")
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "### Production deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "$deployment_url" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify live API
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 5 \
            "$DEPLOYMENT_URL/api/intelligence/live" > /dev/null
